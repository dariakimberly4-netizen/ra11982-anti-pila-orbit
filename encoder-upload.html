<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encoder Workspace Demo</title><style>:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);min-height:100vh;color:#fff}.app{max-width:850px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.back{color:#fff;text-decoration:none;font-weight:800}.box{background:var(--c);color:var(--ink);border-radius:24px;padding:22px;margin-top:18px}.demo,.notice{background:#fff1c9;border:2px solid var(--g);padding:13px;border-radius:14px;margin-bottom:16px;color:#604b19;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #e5dcc9;border-radius:15px;padding:14px;margin-top:10px}.stat b{display:block;font-size:24px;color:var(--n)}.drop{border:3px dashed var(--g);background:#fff;border-radius:18px;padding:25px;text-align:center;margin-top:14px}.btn{border:0;border-radius:12px;background:var(--n);color:#fff;padding:13px 15px;font-weight:800;cursor:pointer;margin:3px}.gold{background:var(--g);color:#17263a}.danger{background:#8b2430}.muted{color:#68778a;font-size:13px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff1c9;color:#604b19;font-weight:800;font-size:11px}.hidden{display:none}select{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:11px;margin:7px 0}.log{font-size:13px;border-left:3px solid var(--g);padding:8px 11px;margin:7px 0;background:#fff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.check{background:#f7f8fa;padding:10px;border-radius:10px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.checks{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><div class="top"><a class="back" href="index.html">← BACK TO ORBIT</a><span class="status">ENCODER • DEMO ONLY</span></div><section class="box"><div class="demo">DEMO ONLY — Use sample files only. Files are not uploaded to GitHub or a server.</div><h1>Encoder Workspace</h1><div class="grid"><div class="stat"><b id="total">0</b>Uploaded Files</div><div class="stat"><b id="ready">0</b>Ready / Submitted</div><div class="stat"><b id="returned">0</b>Returned</div></div><h2>Upload Sample File</h2><label><b>Assign Payout Program</b></label><select id="program"><option>Demo Senior Citizen Cash Benefit</option><option>Demo Financial Assistance Payout</option><option>Demo Employee Benefit / Allowance</option><option>Demo Special Assistance Program</option></select><div class="drop"><div style="font-size:40px">📄</div><b>PDF • XLSX • XLS • CSV</b><br><br><input class="hidden" id="file" type="file" accept=".pdf,.xlsx,.xls,.csv"><button class="btn gold" onclick="file.click()">UPLOAD SAMPLE FILE</button></div><div id="current"></div><h2>Uploaded Files Inbox</h2><div id="inbox"></div><h2>Encoder Activity</h2><div id="logs"></div><button class="btn danger" onclick="resetDemo()">RESET DEMO</button></section></main><script>let items=[],activity=[];const f=document.getElementById('file');f.onchange=()=>addFile(f.files[0]);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function addLog(t){activity.unshift(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' — '+t);render()}function addFile(x){if(!x)return;let ext=x.name.split('.').pop().toLowerCase();if(!['pdf','xlsx','xls','csv'].includes(ext)){alert('Choose PDF, Excel, or CSV.');return}let size=x.size<1048576?(x.size/1024).toFixed(1)+' KB':(x.size/1048576).toFixed(1)+' MB';let it={id:Date.now(),name:x.name,type:ext.toUpperCase(),size,program:program.value,status:'DRAFT',validation:'READY TO VALIDATE'};items.unshift(it);f.value='';addLog('Uploaded '+x.name);openItem(it.id)}function openItem(id){let a=items.find(x=>x.id===id);if(!a)return;current.innerHTML='<div class="card"><span class="status">'+a.status+'</span><h3>'+esc(a.name)+'</h3><p class="muted">'+a.type+' • '+a.size+'<br>'+esc(a.program)+'</p><div class="checks"><div class="check">✓ File type accepted</div><div class="check">✓ Demo file readable</div><div class="check">⚠ Duplicate check: demo only</div><div class="check">⚠ Record validation: sample only</div></div><button class="btn" onclick="validateFile('+a.id+')">VALIDATE</button><button class="btn gold" onclick="submitFile('+a.id+')">SUBMIT TO VERIFIER</button><button class="btn" onclick="returnFile('+a.id+')">SIMULATE RETURN</button><button class="btn danger" onclick="removeFile('+a.id+')">REMOVE</button></div>'}function validateFile(id){let a=items.find(x=>x.id===id);a.validation='VALIDATED';a.status='READY';addLog('Validated '+a.name);openItem(id)}function submitFile(id){let a=items.find(x=>x.id===id);a.status='SUBMITTED';addLog('Submitted '+a.name+' to Verifier');openItem(id)}function returnFile(id){let a=items.find(x=>x.id===id);a.status='RETURNED';addLog('Demo return received for '+a.name);openItem(id)}function removeFile(id){let a=items.find(x=>x.id===id);items=items.filter(x=>x.id!==id);current.innerHTML='';addLog('Removed '+a.name)}function render(){total.textContent=items.length;ready.textContent=items.filter(x=>['READY','SUBMITTED'].includes(x.status)).length;returned.textContent=items.filter(x=>x.status==='RETURNED').length;inbox.innerHTML=items.length?items.map(a=>'<div class="card" onclick="openItem('+a.id+')"><span class="status">'+a.status+'</span><b style="display:block;margin-top:7px">'+esc(a.name)+'</b><span class="muted">'+esc(a.program)+' • '+a.type+' • '+a.size+'</span></div>').join(''):'<p class="muted">No demo files yet.</p>';logs.innerHTML=activity.length?activity.map(x=>'<div class="log">'+esc(x)+'</div>').join(''):'<p class="muted">No activity yet.</p>'}function resetDemo(){if(confirm('Clear all demo activity?')){items=[];activity=[];current.innerHTML='';render()}}render();</script></body></html>
