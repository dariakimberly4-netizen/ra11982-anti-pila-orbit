<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encoder Import Demo</title><style>:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);min-height:100vh;color:#fff}.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px}.back{color:#fff;text-decoration:none;font-weight:800}.box{background:var(--c);color:var(--ink);border-radius:24px;padding:20px;margin-top:16px}.demo{background:#fff1c9;border:2px solid var(--g);padding:12px;border-radius:13px;font-weight:800;color:#604b19}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.stat,.card{background:#fff;border:1px solid #e5dcc9;border-radius:14px;padding:13px}.stat b{display:block;font-size:22px;color:var(--n)}select,input{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:11px;margin:6px 0}.drop{border:3px dashed var(--g);background:#fff;border-radius:18px;padding:22px;text-align:center}.realfile{position:absolute;width:1px;height:1px;opacity:.01}.btn,.picker{display:inline-block;border:0;border-radius:12px;background:var(--n);color:#fff;padding:13px 15px;font-weight:800;cursor:pointer;margin:3px;text-decoration:none}.gold,.picker{background:var(--g);color:#17263a}.danger{background:#8b2430}.muted{color:#68778a;font-size:12px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff1c9;color:#604b19;font-weight:800;font-size:11px}.tablewrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th,td{padding:10px;border-bottom:1px solid #e8e8e8;text-align:left;font-size:13px}th{background:#eef3f8}.bad{background:#fff0f0}.ok{background:#eff9f1}.log{font-size:12px;border-left:3px solid var(--g);padding:7px 10px;margin:6px 0;background:#fff}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.picker{display:block;width:100%}}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main class="app"><div class="top"><a class="back" href="index.html">← BACK TO ORBIT</a><span class="status">ENCODER • DEMO ONLY</span></div><section class="box"><h1>Encoder Import Workspace</h1><div class="grid"><div class="stat"><b id="records">0</b>Records</div><div class="stat"><b id="errors">0</b>Needs Review</div></div><span id="valid" style="display:none">0</span><span id="imports" style="display:none">0</span><label><b>Payout Program</b></label><select id="program"><option>Demo Senior Citizen Cash Benefit</option><option>Demo Financial Assistance Payout</option><option>Demo Employee Benefit / Allowance</option><option>Demo Special Assistance Program</option></select><div class="drop"><div style="font-size:38px">📊</div><b>PDF • XLSX • XLS • CSV</b><br><br><input class="realfile" id="file" type="file" accept=".pdf,.xlsx,.xls,.csv,application/pdf,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><label class="picker" for="file">CHOOSE FILE FROM PHONE</label><p class="muted">Choose a sample PDF, Excel, or CSV file.</p></div><div id="summary"></div><div id="tools" style="display:none"><input id="search" placeholder="Search name or ID" oninput="renderRows()"><select id="filter" onchange="renderRows()"><option value="ALL">All Records</option><option value="VALID">Valid</option><option value="REVIEW">Needs Review</option><option value="DUPLICATE">Duplicates</option></select></div><div id="preview"></div><h2>Important History</h2><p class="muted">Every file opened by the Encoder appears here immediately.</p><div id="history"></div><div id="logs" style="display:none"></div><button class="btn danger" onclick="resetDemo()">RESET DEMO</button></section></main><script>let dirty=false,batchNo='';let rows=[],acts=JSON.parse(localStorage.getItem('encoderDemoActs')||'[]'),hist=JSON.parse(localStorage.getItem('encoderDemoHistory')||'[]'),currentFile='';const f=document.getElementById('file');f.addEventListener('change',()=>handle(f.files[0]));function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function saveDemo(){localStorage.setItem('encoderDemoActs',JSON.stringify(acts));localStorage.setItem('encoderDemoHistory',JSON.stringify(hist))}function log(s){acts.unshift(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' — '+s);saveDemo();renderLogs()}function csvLine(s){let a=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c=='"'){if(q&&s[i+1]=='"'){v+='"';i++}else q=!q}else if(c==','&&!q){a.push(v.trim());v=''}else v+=c}a.push(v.trim());return a}function handle(x){if(!x)return;let ext=(x.name.split('.').pop()||'').toLowerCase();if(!['pdf','xlsx','xls','csv'].includes(ext)){alert('Choose PDF, Excel, or CSV.');return}if(ext==='csv'){let r=new FileReader();r.onload=()=>parseCSV(r.result,x);r.readAsText(x)}else if(ext==='xlsx'||ext==='xls'){parseExcel(x)}else{rows=[];show(x.name,'PDF',true)}}function extLabel(n){return (n.split('.').pop()||'EXCEL').toUpperCase()} function parseExcel(x){if(typeof XLSX==='undefined'){alert('Excel reader is still loading. Please try again.');return}let r=new FileReader();r.onload=()=>{try{let wb=XLSX.read(r.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});if(data.length<2){alert('Excel sheet has no data rows.');return}let hi=data.findIndex((a,i)=>i<20&&a.some(v=>/name|pangalan|beneficiary/i.test(String(v))));if(hi<0)hi=0;let h=data[hi].map(z=>String(z).trim().toLowerCase()),ni=h.findIndex(z=>/name|pangalan|beneficiary/.test(z)),ii=h.findIndex(z=>/id|control|reference|osca/.test(z)),ai=h.findIndex(z=>/area|barangay|address/.test(z));rows=data.slice(hi+1,hi+201).filter(a=>a.some(v=>String(v).trim())).map((a,k)=>{let name=ni>=0?a[ni]:a[0],id=ii>=0?a[ii]:(a[1]||'ROW-'+String(k+1).padStart(3,'0')),area=ai>=0?a[ai]:(a[2]||'');name=String(name||'').trim();id=String(id||'').trim();area=String(area||'').trim();return{name,id,area,state:(name&&id)?'VALID':'REVIEW'}});show(x.name,extLabel(x.name),false)}catch(err){alert('Could not read this Excel file. Try saving it as XLSX or CSV.')}};r.readAsArrayBuffer(x);setTimeout(()=>{f.value=''},100)} function parseCSV(txt,x){let lines=String(txt).split(/\r?\n/).filter(z=>z.trim());if(lines.length<2){alert('CSV has no data rows.');return}let h=csvLine(lines[0]).map(z=>z.toLowerCase());let ni=h.findIndex(z=>/name/.test(z)),ii=h.findIndex(z=>/id|control|reference/.test(z)),ai=h.findIndex(z=>/area|barangay|address/.test(z));rows=lines.slice(1,51).map((z,k)=>{let c=csvLine(z),name=ni>=0?c[ni]:c[0],id=ii>=0?c[ii]:(c[1]||'DEMO-'+String(k+1).padStart(3,'0')),area=ai>=0?c[ai]:(c[2]||'');return{name:name||'',id:id||'',area:area||'',state:(name&&id)?'VALID':'REVIEW'}});show(x.name,'CSV',false)}function show(name,type,sample){currentFile=name;batchNo='BATCH-'+new Date().getFullYear()+'-'+String(hist.length+1).padStart(3,'0');dirty=false;let bad=rows.filter(r=>r.state==='REVIEW').length;summary.innerHTML='<div class="card"><span class="status">DRAFT IMPORT</span><h3>'+e(name)+'</h3><b>'+e(batchNo)+'</b><p class="muted">'+type+' • '+e(program.value)+(sample?' • DEMO ROW PREVIEW':' • Parsed locally')+'</p><b>'+rows.length+' records • '+(rows.length-bad)+' valid • '+bad+' need review</b><br><br><button class="btn" onclick="validateRows()">VALIDATE</button><button class="btn gold" onclick="approveImport()">SUBMIT TO VERIFIER</button><button class="btn" onclick="downloadErrors()">DOWNLOAD ERROR LIST</button></div>';renderRows();let h={file:name,program:program.value,count:rows.length,valid:rows.length-bad,review:bad,status:'OPENED',time:new Date().toLocaleString()};h.batch=batchNo;hist.unshift(h);saveDemo();renderHistory();log('Opened '+name)}function markDuplicates(){let seen={};rows.forEach(r=>{if(r.state==='DUPLICATE')r.state='VALID';let k=String(r.id||'').trim().toLowerCase();if(k){if(seen[k]){r.state='DUPLICATE';seen[k].state='DUPLICATE'}else seen[k]=r}})}function renderRows(){markDuplicates();records.textContent=rows.length;valid.textContent=rows.filter(r=>r.state==='VALID').length;errors.textContent=rows.filter(r=>r.state!=='VALID').length;tools.style.display=rows.length?'block':'none';let q=(search.value||'').toLowerCase(),fv=filter.value;let list=rows.map((r,i)=>({r,i})).filter(o=>(fv==='ALL'||o.r.state===fv)&&(!q||(o.r.name+' '+o.r.id+' '+o.r.area).toLowerCase().includes(q)));preview.innerHTML=rows.length?'<div class="tablewrap"><table><thead><tr><th>Status</th><th>Name</th><th>ID / Control</th><th>Area</th><th>Action</th></tr></thead><tbody>'+list.map(o=>'<tr class="'+(o.r.state==='VALID'?'ok':'bad')+'"><td>'+o.r.state+'</td><td>'+e(o.r.name)+'</td><td>'+e(o.r.id)+'</td><td>'+e(o.r.area)+'</td><td><button class="btn" onclick="editRow('+o.i+')">EDIT</button></td></tr>').join('')+'</tbody></table></div>':''}function editRow(i){let r=rows[i];if(r.locked){alert('This batch was submitted to the Verifier and is locked.');return}let n=prompt('Demo beneficiary name',r.name);if(n===null)return;let id=prompt('ID / Control number',r.id);if(id===null)return;let a=prompt('Area / Barangay',r.area);if(a===null)return;r.name=n.trim();r.id=id.trim();r.area=a.trim();r.state=(r.name&&r.id)?'VALID':'REVIEW';dirty=true;renderRows();log('Edited demo row '+(i+1))}function validateRows(){rows.forEach(r=>r.state=(r.name&&r.id)?'VALID':'REVIEW');let h=hist.find(x=>x.file===currentFile);if(h){h.valid=rows.filter(r=>r.state==='VALID').length;h.review=rows.filter(r=>r.state==='REVIEW').length;h.status='VALIDATED';h.time=new Date().toLocaleString()}saveDemo();renderRows();renderHistory();log('Validated '+rows.length+' demo records')}function approveImport(){if(!rows.length)return;if(!confirm(rows.length+' records will be submitted to the Verifier. Continue?'))return;markDuplicates();let bad=rows.filter(r=>r.state!=='VALID').length;if(bad){alert('Fix the '+bad+' record(s) marked NEEDS REVIEW or DUPLICATE first.');return}let h=hist.find(x=>x.file===currentFile);if(h){h.status='IMPORTED';h.count=rows.length;h.valid=rows.length;h.review=0;h.time=new Date().toLocaleString()}saveDemo();renderHistory();log('Approved demo import of '+rows.length+' records');summary.querySelector('.status').textContent='SUBMITTED TO VERIFIER';rows.forEach(r=>r.locked=true);dirty=false;let h2=hist.find(x=>x.file===currentFile);if(h2){h2.status='SUBMITTED TO VERIFIER';h2.time=new Date().toLocaleString()}saveDemo();renderHistory()}function renderHistory(){imports.textContent=hist.filter(h=>h.status==='IMPORTED').reduce((a,b)=>a+(b.count||0),0);history.innerHTML=hist.length?hist.map(h=>'<div class="card"><span class="status">'+e(h.status)+'</span><b style="display:block;margin-top:6px">'+e(h.batch||'BATCH')+' • '+e(h.file)+'</b><span class="muted">'+e(h.program)+'<br>'+h.count+' records • '+(h.valid||0)+' valid • '+(h.review||0)+' review<br>'+e(h.time)+'</span></div>').join(''):'<div class="card"><span class="status">WAITING</span><b style="display:block;margin-top:6px">No file opened yet</b><span class="muted">Choose an Excel, CSV, or PDF file above. It will appear here immediately.</span></div>'}function renderLogs(){logs.innerHTML=acts.length?acts.map(a=>'<div class="log">'+e(a)+'</div>').join(''):'<p class="muted">No activity yet.</p>'}function downloadErrors(){let bad=rows.filter(r=>r.state!=='VALID');if(!bad.length){alert('No error records to export.');return}let csv='Status,Name,ID,Area\n'+bad.map(r=>[r.state,r.name,r.id,r.area].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(batchNo||'batch')+'-errors.csv';a.click();URL.revokeObjectURL(a.href)}window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});function resetDemo(){if(confirm('Clear demo import data?')){rows=[];acts=[];hist=[];localStorage.removeItem('encoderDemoActs');localStorage.removeItem('encoderDemoHistory');summary.innerHTML='';preview.innerHTML='';renderHistory();records.textContent=valid.textContent=errors.textContent=imports.textContent='0';renderLogs()}}renderHistory();renderLogs();</script></body></html>
