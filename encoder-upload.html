<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encoder Upload - Anti-Pila</title><style>:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);min-height:100vh;color:#fff}.app{max-width:720px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.box{margin-top:22px;background:var(--c);color:var(--ink);padding:24px;border-radius:24px}.drop{border:3px dashed var(--g);border-radius:20px;padding:34px 18px;text-align:center;background:#fff}.drop h2{color:var(--n);margin:5px}.btn{border:0;border-radius:13px;background:var(--n);color:#fff;padding:14px 18px;font-weight:800;cursor:pointer}.gold{background:var(--g);color:#17263a}.file{background:#fff;border:1px solid #e4dac3;padding:15px;border-radius:14px;margin-top:14px}.muted{color:#68778a;font-size:13px}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff1c9;color:#604b19;font-weight:800;font-size:12px}.hidden{display:none}.back{color:#fff;text-decoration:none;font-weight:800}select{width:100%;padding:13px;border-radius:11px;border:1px solid #ccd5df;margin:8px 0 16px}</style></head><body><main class="app"><div class="top"><a class="back" href="index.html">← BACK TO ORBIT</a><span class="status">ENCODER</span></div><section class="box"><h1>Upload Beneficiary File</h1><p class="muted">Choose a payout program, then upload a PDF, Excel, or CSV file. Demo files remain in this browser session and are not uploaded to GitHub.</p><label><b>Payout Program</b></label><select id="program"><option>Senior Citizen Cash Benefit</option><option>Financial Assistance Payout</option><option>Employee Benefit / Allowance</option><option>Special Assistance Program</option></select><div class="drop" id="drop"><div style="font-size:44px">📄</div><h2>UPLOAD FILE</h2><p>PDF • XLSX • XLS • CSV</p><input class="hidden" id="file" type="file" accept=".pdf,.xlsx,.xls,.csv,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"><button class="btn gold" onclick="file.click()">CHOOSE FILE</button></div><div id="preview"></div></section></main><script>const f=document.getElementById('file'),d=document.getElementById('drop'),v=document.getElementById('preview');f.onchange=()=>show(f.files[0]);['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.style.opacity='.7'}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.style.opacity='1'}));d.addEventListener('drop',e=>show(e.dataTransfer.files[0]));function show(x){if(!x)return;let ext=x.name.split('.').pop().toLowerCase();if(!['pdf','xlsx','xls','csv'].includes(ext)){alert('Please choose PDF, Excel, or CSV.');return}let size=x.size<1048576?(x.size/1024).toFixed(1)+' KB':(x.size/1048576).toFixed(1)+' MB';v.innerHTML='<div class="file"><span class="status">READY FOR REVIEW</span><h3>'+esc(x.name)+'</h3><p class="muted">'+ext.toUpperCase()+' • '+size+'<br>Program: '+esc(program.value)+'</p><button class="btn" onclick="submitFile()">SUBMIT FOR VERIFICATION</button> <button class="btn gold" onclick="clearFile()">REMOVE</button></div>'}function submitFile(){v.querySelector('.status').textContent='SUBMITTED FOR VERIFICATION';v.querySelector('.status').style.background='#dff4e5';alert('Demo submission recorded in this browser session.')}function clearFile(){f.value='';v.innerHTML=''}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
