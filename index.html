<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA 11982 Anti-Pila Orbit</title><style>:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);color:#fff;min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:clamp(22px,4vw,36px)}.top p{margin:5px 0;color:#d9e5f3}.tag{border:1px solid #ffffff33;border-radius:999px;padding:9px 13px;font-size:12px}.layout{display:grid;grid-template-columns:1fr .9fr;gap:24px;align-items:center;margin-top:22px}.orbit{position:relative;aspect-ratio:1;max-width:620px;margin:auto;border-radius:50%;border:1px solid #ffffff2c;background:radial-gradient(circle,#154b7d 0 24%,#09294d 25% 52%,transparent 53%)}.center,.node{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center}.center{inset:34%;background:linear-gradient(145deg,#f8e7b4,#d4a63d);color:#061a33;padding:12px}.node{width:23%;aspect-ratio:1;background:#09274a;color:#fff;border:2px solid var(--g);font-weight:800;font-size:11px;padding:8px;cursor:pointer;touch-action:manipulation}.node.active{background:#fff6df;color:#09274a;box-shadow:0 0 24px #d8ad4b}.n1{top:1%;left:38.5%}.n2{top:15%;right:2%}.n3{top:43%;right:-2%}.n4{bottom:7%;right:10%}.n5{bottom:1%;left:38.5%}.n6{bottom:7%;left:10%}.n7{top:43%;left:-2%}.n8{top:15%;left:2%}.panel{background:var(--c);color:var(--ink);border-radius:24px;padding:22px;min-height:500px;box-shadow:0 20px 60px #0006}.panel.hidden{display:none}.welcome{text-align:center;padding:40px 20px}.welcome h2{color:#09274a}.muted{color:#66758a;font-size:13px}.search{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:12px;font-size:16px}.beneficiary{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e7dfd0;border-radius:16px;padding:16px;margin:10px 0;color:var(--ink);cursor:pointer;font:inherit}.beneficiary.selected{border:3px solid var(--g);background:#fff9e8}.beneficiary strong{display:block;font-size:16px}.pill{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:#fff0c8;color:#76520e;font-size:11px;font-weight:bold}.selecttxt{display:block;margin-top:9px;font-weight:800;color:#09274a}.btn{border:0;border-radius:12px;background:#09274a;color:#fff;padding:14px 16px;font-weight:800;cursor:pointer;margin:4px}.btn.gold{background:var(--g);color:#13243a}.pass,.process{background:#fff;border:2px solid var(--g);border-radius:20px;padding:18px}.passhead{text-align:center;border-bottom:1px solid #e8dcc2;padding-bottom:12px;margin-bottom:14px}.passhead h2{color:#09274a;margin:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#f8f5ed;border-radius:10px;padding:10px}.field small{display:block;color:#718096}.field b{display:block;margin-top:3px}.hero{text-align:center;background:#f8f5ed;border-radius:16px;padding:18px;margin:12px 0}.hero strong{font-size:24px;color:#09274a;display:block}.qr{width:105px;height:105px;margin:14px auto;background:repeating-conic-gradient(#10233d 0 25%,#fff 0 50%) 0/18px 18px;border:8px solid #fff;outline:1px solid #ccc}.notice{background:#fff4d7;border-left:4px solid var(--g);padding:12px;border-radius:10px;margin:12px 0;font-size:13px}.selectedbanner{background:#e8f2ff;border:2px solid #9bbce0;border-radius:16px;padding:16px;margin-top:15px;text-align:center}.selectedbanner strong{display:block;font-size:20px;color:#09274a;margin:4px}.close{float:right;border:0;background:#eee;border-radius:999px;width:38px;height:38px;font-size:20px;cursor:pointer}@media(max-width:820px){.layout{display:block}.orbit{width:92vw}.panel{margin-top:20px;min-height:auto}.node{font-size:9px}.top{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.top,.orbit,.close{display:none!important}.layout{display:block}.panel{box-shadow:none;padding:0}}</style></head><body><main class="app"><header class="top"><div><h1>RA 11982 SENIOR CITIZENS</h1><p>Anti-Pila Digital Payout System</p></div><div class="tag">OSCA • Senior-Friendly Service</div></header><div class="layout" id="layout"><section class="orbit"><div class="center"><b>RA 11982<br>ANTI-PILA<br>PAYOUT</b></div><button class="node n1">NCSC GRANTEES</button><button class="node n2">DIGITAL PASS</button><button class="node n3">PAYOUT SCHEDULE</button><button class="node n4">LIVE QUEUE</button><button class="node n5">VERIFICATION</button><button class="node n6">RELEASE DESK</button><button class="node n7">COMPLETED</button><button class="node n8">AUDIT TRAIL</button></section><section class="panel hidden" id="panel"></section></div></main><script>const p=document.getElementById('panel'),nodes=[...document.querySelectorAll('.node')];let selected=null,q=Number(localStorage.getItem('queue')||0);const people=[{name:'CAJAYON, LAUREANO MELGAR',barangay:'ANIBAN 2',id:'OSCA-ANB-001234',ref:'RA11982-AY5T4E2C58',dob:'1944-07-04',age:'81',amount:'₱10,000',status:'QUALIFIED GRANTEE',req:'COMPLIANT'},{name:'CASES, ALFREDO VILLANUEVA',barangay:'DULONG BAYAN',id:'OSCA-DB-001235',ref:'RA11982-CAS-001235',dob:'1945-02-18',age:'81',amount:'₱10,000',status:'QUALIFIED GRANTEE',req:'COMPLIANT'},{name:'REA, ROSARIO ATILLO',barangay:'HABAY 1',id:'OSCA-HB-001236',ref:'RA11982-REA-001236',dob:'1941-11-09',age:'84',amount:'₱10,000',status:'FOR REVIEW',req:'REQUIREMENTS FOR REVIEW'}];function openPanel(i){p.classList.remove('hidden');nodes.forEach((n,j)=>n.classList.toggle('active',j===i));if(innerWidth<821)p.scrollIntoView({behavior:'smooth',block:'start'})}function closePanel(){p.classList.add('hidden');nodes.forEach(n=>n.classList.remove('active'))}function topbar(){return '<button class="close" onclick="closePanel()">×</button>'}function grantees(){openPanel(0);p.innerHTML=topbar()+'<h2>NCSC Grantees</h2><p class="muted">Select a beneficiary. No other module opens automatically.</p><input class="search" id="s" placeholder="Search name, OSCA ID or barangay"><div id="results"></div><div id="chosen"></div>';document.getElementById('s').oninput=e=>render(people.filter(x=>(x.name+x.id+x.barangay).toLowerCase().includes(e.target.value.toLowerCase())));render(people);chosen()}function render(arr){const r=document.getElementById('results');r.innerHTML='';arr.forEach(x=>{const b=document.createElement('button');b.className='beneficiary'+(selected&&selected.ref===x.ref?' selected':'');b.innerHTML='<strong>'+x.name+'</strong><span class="muted">'+x.barangay+' • '+x.id+'</span><br><span class="pill">'+x.status+'</span><span class="selecttxt">'+(selected&&selected.ref===x.ref?'✓ SELECTED':'SELECT BENEFICIARY')+'</span>';b.onclick=()=>{selected=x;selected.queue=selected.queue||'—';selected.schedule=selected.schedule||'Not assigned';selected.verified=!!selected.verified;selected.released=!!selected.released;render(people);chosen()};r.appendChild(b)})}function chosen(){const c=document.getElementById('chosen');if(c)c.innerHTML=selected?'<div class="selectedbanner"><span class="muted">ACTIVE BENEFICIARY</span><strong>'+selected.name+'</strong><span>'+selected.id+'</span><p><b>Beneficiary selected.</b></p><p class="muted">Close this module, then tap another orbit module when needed.</p></div>':''}function need(i){openPanel(i);if(selected)return true;p.innerHTML=topbar()+'<h2>Select a Beneficiary First</h2><div class="notice">This module remains empty until a beneficiary is selected from NCSC Grantees.</div>';return false}function banner(title){return topbar()+'<div class="hero"><span class="muted">ACTIVE BENEFICIARY</span><strong>'+selected.name+'</strong><span>'+selected.id+' • '+selected.barangay+'</span></div><h2>'+title+'</h2>'}function pass(){if(!need(1))return;p.innerHTML=topbar()+'<div class="pass"><div class="passhead"><small>RA 11982 SENIOR CITIZENS</small><h2>DIGITAL PAYOUT PASS</h2><b>'+selected.ref+'</b></div><div class="grid"><div class="field"><small>BENEFICIARY</small><b>'+selected.name+'</b></div><div class="field"><small>OSCA ID</small><b>'+selected.id+'</b></div><div class="field"><small>BARANGAY</small><b>'+selected.barangay+'</b></div><div class="field"><small>DATE OF BIRTH / AGE</small><b>'+selected.dob+' • '+selected.age+'</b></div><div class="field"><small>PAYOUT</small><b>'+selected.amount+'</b></div><div class="field"><small>STATUS</small><b>'+selected.status+'</b></div></div><div class="qr"></div><div style="text-align:center;font-size:11px">'+selected.ref+'</div></div><button class="btn" onclick="window.print()">PRINT PASS</button>'}function schedule(){if(!need(2))return;p.innerHTML=banner('Payout Schedule')+'<div class="process"><label>Date</label><input class="search" id="date" type="date"><br><br><label>Time</label><input class="search" id="time" type="time"><button class="btn gold" id="save">SAVE SCHEDULE</button></div>';document.getElementById('save').onclick=()=>{selected.schedule=(date.value||'Date pending')+' '+(time.value||'Time pending');document.getElementById('save').textContent='✓ SCHEDULE SAVED'}}function queue(){if(!need(3))return;if(selected.queue==='—'){q++;localStorage.setItem('queue',q);selected.queue='S-'+String(q).padStart(3,'0')}p.innerHTML=banner('Live Queue')+'<div class="hero"><span class="muted">QUEUE NUMBER</span><strong style="font-size:48px">'+selected.queue+'</strong><span>'+selected.schedule+'</span></div>'}function verify(){if(!need(4))return;p.innerHTML=banner('Verification')+'<div class="process"><div class="field"><small>REQUIREMENTS</small><b>'+selected.req+'</b></div><div class="notice">Confirm identity and documentary requirements before release.</div><button class="btn gold" id="v">'+(selected.verified?'✓ VERIFIED':'VERIFY BENEFICIARY')+'</button></div>';document.getElementById('v').onclick=()=>{selected.verified=true;verify()}}function release(){if(!need(5))return;p.innerHTML=banner('Release Desk')+'<div class="process"><div class="field"><small>AMOUNT</small><b>'+selected.amount+'</b></div><div class="field"><small>VERIFICATION</small><b>'+(selected.verified?'VERIFIED':'PENDING')+'</b></div><button class="btn gold" id="r">'+(selected.released?'✓ RELEASED':'MARK RELEASED')+'</button></div>';document.getElementById('r').onclick=()=>{if(!selected.verified){alert('Verify beneficiary first.');return}selected.released=true;release()}}function completed(){if(!need(6))return;p.innerHTML=banner('Completed')+'<div class="process"><h3>'+(selected.released?'✓ PAYOUT COMPLETED':'PAYOUT NOT YET COMPLETED')+'</h3></div>'}function audit(){if(!need(7))return;p.innerHTML=banner('Audit Trail')+'<div class="process"><p>Beneficiary: '+selected.name+'</p><p>Schedule: '+selected.schedule+'</p><p>Queue: '+selected.queue+'</p><p>Verification: '+(selected.verified?'Completed':'Pending')+'</p><p>Release: '+(selected.released?'Completed':'Pending')+'</p></div>'}const actions=[grantees,pass,schedule,queue,verify,release,completed,audit];nodes.forEach((n,i)=>n.onclick=actions[i]);closePanel();</script></body></html>
