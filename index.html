<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA 11982 Anti-Pila Orbit</title><style>:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);color:#fff;min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:clamp(22px,4vw,36px)}.top p{margin:5px 0;color:#d9e5f3}.tag{border:1px solid #ffffff33;border-radius:999px;padding:9px 13px;font-size:12px}.layout{display:grid;grid-template-columns:1fr .9fr;gap:24px;align-items:center;margin-top:22px}.orbit{position:relative;aspect-ratio:1;max-width:620px;margin:auto;border-radius:50%;border:1px solid #ffffff2c;background:radial-gradient(circle,#154b7d 0 24%,#09294d 25% 52%,transparent 53%)}.center,.node{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center}.center{inset:34%;background:linear-gradient(145deg,#f8e7b4,#d4a63d);color:#061a33;padding:12px}.node{width:23%;aspect-ratio:1;background:#09274a;color:#fff;border:2px solid var(--g);font-weight:800;font-size:11px;padding:8px;cursor:pointer;touch-action:manipulation}.node.active{background:#fff6df;color:#09274a;box-shadow:0 0 24px #d8ad4b}.n1{top:1%;left:38.5%}.n2{top:15%;right:2%}.n3{top:43%;right:-2%}.n4{bottom:7%;right:10%}.n5{bottom:1%;left:38.5%}.n6{bottom:7%;left:10%}.n7{top:43%;left:-2%}.n8{top:15%;left:2%}.panel{background:var(--c);color:var(--ink);border-radius:24px;padding:22px;min-height:500px;box-shadow:0 20px 60px #0006}.muted{color:#66758a;font-size:13px}.search{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:12px;font-size:16px}.beneficiary{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e7dfd0;border-radius:16px;padding:16px;margin:10px 0;color:var(--ink);cursor:pointer;touch-action:manipulation;font:inherit}.beneficiary:active{background:#fff7df;border-color:var(--g)}.beneficiary strong{display:block;font-size:16px}.pill{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:#fff0c8;color:#76520e;font-size:11px;font-weight:bold}.openpass{display:block;margin-top:10px;font-weight:800;color:#09274a}.btn{border:0;border-radius:12px;background:#09274a;color:#fff;padding:14px 16px;font-weight:800;cursor:pointer;margin:4px;touch-action:manipulation}.btn.gold{background:var(--g);color:#13243a}.pass,.process{background:#fff;border:2px solid var(--g);border-radius:20px;padding:18px}.passhead{text-align:center;border-bottom:1px solid #e8dcc2;padding-bottom:12px;margin-bottom:14px}.passhead h2{color:#09274a;margin:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#f8f5ed;border-radius:10px;padding:10px}.field small{display:block;color:#718096}.field b{display:block;margin-top:3px}.workflow{display:flex;gap:5px;overflow:auto;margin-bottom:15px;padding-bottom:5px}.step{white-space:nowrap;padding:7px 9px;border-radius:999px;background:#e8edf3;color:#66758a;font-size:10px;font-weight:bold}.step.on{background:#09274a;color:#fff}.step.done{background:#dff3df;color:#246324}.hero{text-align:center;background:#f8f5ed;border-radius:16px;padding:18px;margin:12px 0}.hero strong{font-size:24px;color:#09274a;display:block}.qr{width:105px;height:105px;margin:14px auto;background:repeating-conic-gradient(#10233d 0 25%,#fff 0 50%) 0/18px 18px;border:8px solid #fff;outline:1px solid #ccc}.notice{background:#fff4d7;border-left:4px solid var(--g);padding:12px;border-radius:10px;margin:12px 0;font-size:13px}.actions{margin-top:14px}.complete{text-align:center;padding:25px}.complete .check{font-size:60px}.complete h2{color:#17653a}@media(max-width:820px){.layout{grid-template-columns:1fr}.orbit{width:92vw}.panel{min-height:auto}.node{font-size:9px}.top{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.top,.orbit,.no-print,.workflow{display:none!important}.layout{display:block}.panel{box-shadow:none;padding:0}.pass{max-width:700px;margin:auto}}</style></head><body><main class="app"><header class="top"><div><h1>RA 11982 SENIOR CITIZENS</h1><p>Anti-Pila Digital Payout System</p></div><div class="tag">OSCA • Senior-Friendly Service</div></header><div class="layout"><section class="orbit"><div class="center"><b>RA 11982<br>ANTI-PILA<br>PAYOUT</b></div><button class="node n1" data-step="0">NCSC GRANTEES</button><button class="node n2" data-step="1">DIGITAL PASS</button><button class="node n3" data-step="2">PAYOUT SCHEDULE</button><button class="node n4" data-step="3">LIVE QUEUE</button><button class="node n5" data-step="4">VERIFICATION</button><button class="node n6" data-step="5">RELEASE DESK</button><button class="node n7" data-step="6">COMPLETED</button><button class="node n8" data-step="7">AUDIT TRAIL</button></section><section class="panel" id="panel"></section></div></main><script>const p=document.getElementById('panel');const nodes=[...document.querySelectorAll('.node')];const labels=['Beneficiary','Digital Pass','Schedule','Queue','Verification','Release','Completed','Audit'];let q=Number(localStorage.getItem('queue')||0);const people=[{name:'CAJAYON, LAUREANO MELGAR',barangay:'ANIBAN 2',id:'OSCA-ANB-001234',ref:'RA11982-AY5T4E2C58',dob:'1944-07-04',age:'81',amount:'₱10,000',status:'QUALIFIED GRANTEE',req:'COMPLIANT'},{name:'CASES, ALFREDO VILLANUEVA',barangay:'DULONG BAYAN',id:'OSCA-DB-001235',ref:'RA11982-CAS-001235',dob:'1945-02-18',age:'81',amount:'₱10,000',status:'QUALIFIED GRANTEE',req:'COMPLIANT'},{name:'REA, ROSARIO ATILLO',barangay:'HABAY 1',id:'OSCA-HB-001236',ref:'RA11982-REA-001236',dob:'1941-11-09',age:'84',amount:'₱10,000',status:'FOR REVIEW',req:'REQUIREMENTS FOR REVIEW'}];let selected=null,current=0;function setActive(i){current=i;nodes.forEach((n,j)=>n.classList.toggle('active',j===i))}function flow(i){return '<div class="workflow">'+labels.map((x,j)=>'<span class="step '+(j<i?'done':j===i?'on':'')+'">'+(j<i?'✓ ':'')+x+'</span>').join('')+'</div>'}function beneficiary(){setActive(0);p.innerHTML='<h2>Select Beneficiary</h2><p class="muted">Tap a beneficiary. The same record will automatically continue through every payout module.</p><input class="search" id="s" placeholder="Search name, OSCA ID or barangay"><div id="results"></div>';document.getElementById('s').oninput=e=>render(people.filter(x=>(x.name+x.id+x.barangay).toLowerCase().includes(e.target.value.toLowerCase())));render(people)}function render(arr){const r=document.getElementById('results');r.innerHTML='';arr.forEach(x=>{const b=document.createElement('button');b.className='beneficiary';b.innerHTML='<strong>'+x.name+'</strong><span class="muted">'+x.barangay+' • '+x.id+'</span><br><span class="pill">'+x.status+'</span><span class="openpass">SELECT & CONTINUE →</span>';b.onclick=()=>{selected=x;selected.queue='—';selected.schedule='Not assigned';selected.verified=false;selected.released=false;showStep(1)};r.appendChild(b)})}function header(title,i){return flow(i)+'<div class="hero"><span class="muted">ACTIVE BENEFICIARY</span><strong>'+selected.name+'</strong><span>'+selected.id+' • '+selected.barangay+'</span></div><h2>'+title+'</h2>'}function showStep(i){if(!selected){beneficiary();return}setActive(i);if(i===1)pass();if(i===2)schedule();if(i===3)queue();if(i===4)verify();if(i===5)release();if(i===6)completed();if(i===7)audit()}function pass(){p.innerHTML=flow(1)+'<div class="pass"><div class="passhead"><small>RA 11982 SENIOR CITIZENS</small><h2>DIGITAL PAYOUT PASS</h2><b>'+selected.ref+'</b></div><div class="grid"><div class="field"><small>BENEFICIARY</small><b>'+selected.name+'</b></div><div class="field"><small>OSCA ID</small><b>'+selected.id+'</b></div><div class="field"><small>BARANGAY</small><b>'+selected.barangay+'</b></div><div class="field"><small>DATE OF BIRTH / AGE</small><b>'+selected.dob+' • '+selected.age+'</b></div><div class="field"><small>PAYOUT</small><b>'+selected.amount+'</b></div><div class="field"><small>STATUS</small><b>'+selected.status+'</b></div></div><div class="qr"></div><div style="text-align:center;font-size:11px">'+selected.ref+'</div></div><div class="actions no-print"><button class="btn" onclick="beneficiary()">← CHANGE BENEFICIARY</button><button class="btn" onclick="window.print()">PRINT PASS</button><button class="btn gold" onclick="showStep(2)">NEXT: PAYOUT SCHEDULE →</button></div>'}function schedule(){p.innerHTML=header('Payout Schedule',2)+'<div class="process"><p>Assign the payout schedule for this beneficiary.</p><label>Date</label><input class="search" id="date" type="date"><br><br><label>Time</label><input class="search" id="time" type="time"><div class="actions"><button class="btn" onclick="showStep(1)">← BACK</button><button class="btn gold" id="saveSchedule">SAVE & CONTINUE →</button></div></div>';document.getElementById('saveSchedule').onclick=()=>{selected.schedule=(document.getElementById('date').value||'Date pending')+' '+(document.getElementById('time').value||'Time pending');showStep(3)}}function queue(){if(selected.queue==='—'){q++;localStorage.setItem('queue',q);selected.queue='S-'+String(q).padStart(3,'0')}p.innerHTML=header('Live Queue',3)+'<div class="process"><div class="hero"><span class="muted">ASSIGNED QUEUE NUMBER</span><strong style="font-size:48px">'+selected.queue+'</strong><span>'+selected.schedule+'</span></div><div class="actions"><button class="btn" onclick="showStep(2)">← BACK</button><button class="btn gold" onclick="showStep(4)">NEXT: VERIFICATION →</button></div></div>'}function verify(){p.innerHTML=header('Verification',4)+'<div class="process"><div class="grid"><div class="field"><small>ELIGIBILITY STATUS</small><b>'+selected.status+'</b></div><div class="field"><small>REQUIREMENTS</small><b>'+selected.req+'</b></div></div><div class="notice">Confirm the beneficiary identity and required documents before proceeding.</div><div class="actions"><button class="btn" onclick="showStep(3)">← BACK</button><button class="btn gold" onclick="selected.verified=true;showStep(5)">VERIFY & CONTINUE →</button></div></div>'}function release(){p.innerHTML=header('Release Desk',5)+'<div class="process"><div class="grid"><div class="field"><small>QUEUE</small><b>'+selected.queue+'</b></div><div class="field"><small>AMOUNT</small><b>'+selected.amount+'</b></div><div class="field"><small>VERIFICATION</small><b>'+(selected.verified?'VERIFIED':'PENDING')+'</b></div><div class="field"><small>REFERENCE</small><b>'+selected.ref+'</b></div></div><div class="notice">Final release should only be recorded after the authorized staff confirms the actual payout and acknowledgment.</div><div class="actions"><button class="btn" onclick="showStep(4)">← BACK</button><button class="btn gold" onclick="selected.released=true;showStep(6)">MARK RELEASED & COMPLETE →</button></div></div>'}function completed(){p.innerHTML=flow(6)+'<div class="complete"><div class="check">✓</div><h2>Transaction Completed</h2><h3>'+selected.name+'</h3><p>'+selected.ref+'</p><p><b>'+selected.amount+'</b> • '+selected.queue+'</p><button class="btn gold" onclick="showStep(7)">VIEW AUDIT TRAIL →</button><button class="btn" onclick="selected=null;beneficiary()">PROCESS NEXT BENEFICIARY</button></div>'}function audit(){p.innerHTML=header('Audit Trail',7)+'<div class="process"><p>✓ Beneficiary selected</p><p>✓ Digital pass opened</p><p>✓ Schedule: '+selected.schedule+'</p><p>✓ Queue assigned: '+selected.queue+'</p><p>✓ Verification: '+(selected.verified?'Completed':'Pending')+'</p><p>✓ Release: '+(selected.released?'Completed':'Pending')+'</p><div class="actions"><button class="btn gold" onclick="selected=null;beneficiary()">PROCESS NEXT BENEFICIARY</button></div></div>'}nodes.forEach((n,i)=>n.onclick=()=>{if(i===0)beneficiary();else showStep(i)});beneficiary();</script></body></html>
