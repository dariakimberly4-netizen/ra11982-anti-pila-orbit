<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anti-Pila Payout System</title>
<style>
:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d;--ok:#1e6d44;--bad:#9c2d3d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);color:#fff;min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}.hidden{display:none!important}.login{max-width:430px;margin:8vh auto;background:#fff;color:var(--ink);padding:28px;border-radius:24px}.login h1{color:var(--n);margin-bottom:4px}.login input,.login select{width:100%;padding:14px;margin:7px 0 13px;border:1px solid #ccd5df;border-radius:12px;font-size:16px}.quick{width:100%;padding:15px;border:2px solid var(--g);background:#fff8e7;color:#09274a;border-radius:14px;font-weight:900;font-size:16px;margin:4px 0 14px;cursor:pointer}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:clamp(24px,4vw,38px)}.top p{margin:5px 0;color:#d9e5f3}.role{background:#fff0c8;color:#624a15;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800}.layout{display:grid;grid-template-columns:1fr .9fr;gap:24px;align-items:center;margin-top:22px}.layout.orbit-only{display:block}.orbit{position:relative;aspect-ratio:1;max-width:620px;margin:auto;border-radius:50%;border:1px solid #ffffff2c;background:radial-gradient(circle,#154b7d 0 24%,#09294d 25% 52%,transparent 53%)}.center,.node{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center}.center{inset:34%;background:linear-gradient(145deg,#f8e7b4,#d4a63d);color:#061a33;padding:12px}.node{width:22%;aspect-ratio:1;background:#09274a;color:#fff;border:2px solid var(--g);font-weight:800;font-size:10px;padding:8px;cursor:pointer}.node.active{background:#fff6df;color:#09274a}.n1{top:1%;left:39%}.n2{top:14%;right:4%}.n3{top:43%;right:-2%}.n4{bottom:7%;right:9%}.n5{bottom:1%;left:39%}.n6{bottom:7%;left:9%}.n7{top:43%;left:-2%}.n8{top:14%;left:4%}.panel{background:var(--c);color:var(--ink);border-radius:24px;padding:22px;min-height:500px}.muted{color:#66758a;font-size:13px}.card,.process{background:#fff;border:1px solid #e6dcc7;border-radius:16px;padding:16px;margin:10px 0}.card{width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.card.selected{border:3px solid var(--g)}.card strong{display:block}.search,.field{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:12px;margin:6px 0}.btn{border:0;border-radius:12px;background:#09274a;color:#fff;padding:14px 16px;font-weight:800;cursor:pointer;margin:3px}.gold{background:var(--g);color:#13243a}.danger{background:#8b2430}.okbtn{background:#1e6d44}.hero{text-align:center;background:#f8f5ed;border-radius:16px;padding:18px;margin:12px 0}.hero strong{font-size:24px;color:#09274a;display:block}.notice{background:#fff4d7;border-left:4px solid var(--g);padding:12px;border-radius:10px}.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:20px}.passpreview{background:#fff;color:var(--n);padding:28px;border-radius:16px;text-align:center}.barcode{height:72px;margin:22px auto 6px;max-width:520px;background:repeating-linear-gradient(90deg,#000 0 3px,#fff 3px 6px,#000 6px 8px,#fff 8px 13px,#000 13px 18px,#fff 18px 21px)}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef3f8;color:#29415e;font-size:11px;font-weight:800}.pill.ok{background:#e8f7ed;color:#1e6d44}.pill.bad{background:#fdecef;color:#8b2430}.rowactions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:820px){.layout{display:block}.orbit{width:92vw}.panel{margin-top:20px}.node{font-size:8.5px}.top{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<section id="login" class="login">
<h1>ANTI-PILA</h1><p>Staff Payout Command Center</p>
<label>Role</label>
<select id="role"><option>Administrator</option><option>Encoder</option><option>Verifier</option><option>Release Officer</option><option>Auditor</option></select>
<button class="quick" onclick="oneTap()">🔑 ONE-TAP DEMO PASSWORD: 1234</button>
<label>Password / PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="Tap the one-tap password above">
<button class="btn" onclick="signIn()">LOGIN</button>
<p class="muted">Demo access only.</p>
</section>

<main class="app hidden" id="app">
<header class="top">
<div><h1>ANTI-PILA PAYOUT SYSTEM</h1><p>Universal Digital Payout & Distribution Management</p></div>
<div><span class="role" id="who"></span><button class="btn" onclick="logout()">LOGOUT</button></div>
</header>
<div class="layout orbit-only" id="layout">
<section class="orbit">
<div class="center"><b>ANTI-PILA<br>PAYOUT<br>COMMAND CENTER</b></div>
<button class="node n1">PAYOUT PROGRAMS</button><button class="node n2">BENEFICIARIES</button><button class="node n3">DIGITAL PASS</button><button class="node n4">LIVE QUEUE</button><button class="node n5">VERIFICATION</button><button class="node n6">RELEASE DESK</button><button class="node n7">COMPLETED</button><button class="node n8">AUDIT TRAIL</button>
</section>
<section class="panel hidden" id="panel"></section>
</div>
</main>

<script>
const p=document.getElementById('panel'),layout=document.getElementById('layout'),nodes=[...document.querySelectorAll('.node')];
let program=null,selected=null,q=Number(localStorage.getItem('universalQueue')||0);
let programs=JSON.parse(localStorage.getItem('antiPilaPrograms')||'null')||[{id:'P-001',name:'Senior Citizen Cash Benefit',office:'Social Services / OSCA',amount:'Program-defined',date:'Official payout date',venue:'Official payout venue'}];
localStorage.setItem('antiPilaPrograms',JSON.stringify(programs));

function loadPeople(){return JSON.parse(localStorage.getItem('antiPilaBeneficiaries')||'[]')}
function savePeople(v){localStorage.setItem('antiPilaBeneficiaries',JSON.stringify(v))}
function loadBatches(){return JSON.parse(localStorage.getItem('encoderVerifierBatches')||'[]')}
function saveBatches(v){localStorage.setItem('encoderVerifierBatches',JSON.stringify(v))}
function auditLog(action,detail){let a=JSON.parse(localStorage.getItem('antiPilaAudit')||'[]');a.unshift({time:new Date().toLocaleString(),role:(document.getElementById('who').textContent||'System'),action,detail});localStorage.setItem('antiPilaAudit',JSON.stringify(a.slice(0,500)))}
function oneTap(){pin.value='1234';pin.focus()}
function signIn(){
 if(pin.value!=='1234'){alert('Incorrect demo PIN');return}
 if(role.value==='Encoder'){sessionStorage.setItem('antiPilaRole','Encoder');location.href='encoder-list.html';return}
 who.textContent=role.value;sessionStorage.setItem('antiPilaRole',role.value);login.classList.add('hidden');app.classList.remove('hidden');closeM()
}
function logout(){sessionStorage.removeItem('antiPilaRole');pin.value='';app.classList.add('hidden');login.classList.remove('hidden')}
function openM(i){layout.classList.remove('orbit-only');p.classList.remove('hidden');nodes.forEach((n,j)=>n.classList.toggle('active',j===i));if(innerWidth<821)setTimeout(()=>p.scrollIntoView({behavior:'smooth'}),50)}
function closeM(){p.classList.add('hidden');layout.classList.add('orbit-only');nodes.forEach(n=>n.classList.remove('active'))}
function x(){return '<button class="close" onclick="closeM()">×</button>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function programsM(){
 openM(0);p.innerHTML=x()+'<h2>Payout Programs</h2><button class="btn gold" onclick="newProgram()">+ CREATE PAYOUT PROGRAM</button><div id="programs"></div>';
 programs.forEach(a=>{let b=document.createElement('button');b.className='card'+(program&&program.id===a.id?' selected':'');b.innerHTML='<strong>'+esc(a.name)+'</strong><span class="muted">'+esc(a.id)+' • '+esc(a.office)+'<br>'+esc(a.date)+' • '+esc(a.venue)+'</span>';b.onclick=()=>{program=a;selected=null;programsM()};document.getElementById('programs').appendChild(b)})
}
function newProgram(){p.innerHTML=x()+'<h2>Create Payout Program</h2><input class="field" id="pn" placeholder="Program name"><input class="field" id="po" placeholder="Office / Department"><input class="field" id="pa" placeholder="Payout amount"><label>Payout date</label><input class="field" id="pd" type="date"><input class="field" id="pv" placeholder="Payout venue"><button class="btn gold" onclick="saveProgram()">SAVE PROGRAM</button>'}
function saveProgram(){if(!pn.value.trim()){alert('Enter program name.');return}let a={id:'P-'+String(programs.length+1).padStart(3,'0'),name:pn.value.trim(),office:po.value.trim()||'Program Office',amount:pa.value.trim()||'Program-defined',date:pd.value||'Official payout date',venue:pv.value.trim()||'Official payout venue'};programs.push(a);localStorage.setItem('antiPilaPrograms',JSON.stringify(programs));program=a;selected=null;auditLog('Created payout program',a.name);programsM()}

function peopleForProgram(){return loadPeople().filter(v=>!program||v.programId===program.id||v.programName===program.name)}
function beneficiaries(){
 openM(1);if(!program){p.innerHTML=x()+'<h2>Beneficiaries</h2><div class="notice">Select a Payout Program first.</div>';return}
 p.innerHTML=x()+'<h2>Beneficiaries</h2><div class="hero"><strong>'+esc(program.name)+'</strong></div><input id="s" class="search" placeholder="Search beneficiary"><div id="people"></div>';
 s.oninput=()=>renderPeople(peopleForProgram().filter(a=>(a.name+' '+a.id+' '+a.area+' '+(a.batch||'')).toLowerCase().includes(s.value.toLowerCase())));renderPeople(peopleForProgram())
}
function renderPeople(a){
 people.innerHTML='';
 if(!a.length){people.innerHTML='<div class="notice">No submitted beneficiaries for this payout program yet. Encoder submissions will appear here automatically.</div>';return}
 a.forEach(v=>{let b=document.createElement('button');b.className='card'+(selected&&selected.recordKey===v.recordKey?' selected':'');let st=v.verifierStatus||'FOR VERIFICATION';b.innerHTML='<strong>'+esc(v.name)+'</strong><span class="muted">'+esc(v.id)+' • '+esc(v.area)+' • '+esc(v.batch||'')+'</span><br><span class="pill '+(st==='VERIFIED'?'ok':st==='RETURNED'?'bad':'')+'">'+esc(st)+'</span>';b.onclick=()=>{selected=v;renderPeople(a)};people.appendChild(b)})
}
function need(i){openM(i);if(!program||!selected){p.innerHTML=x()+'<h2>'+nodes[i].textContent+'</h2><div class="notice">'+(!program?'Select a Payout Program first.':'Select a beneficiary first.')+'</div>';return false}return true}
function banner(t){return x()+'<div class="hero"><span class="muted">'+esc(program.name)+'</span><strong>'+esc(selected.name)+'</strong></div><h2>'+t+'</h2>'}
function updateSelected(patch){
 let all=loadPeople(),ix=all.findIndex(v=>v.recordKey===selected.recordKey);if(ix<0)return;
 all[ix]=Object.assign({},all[ix],patch);selected=all[ix];savePeople(all)
}
function printPass(){const control=program.id+'-'+selected.id;const params=new URLSearchParams({name:selected.name,program:program.name,control,date:program.date,time:'OFFICIAL PAYOUT TIME',venue:program.venue,queue:selected.queue||'—',status:selected.verified?'VERIFIED':'FOR VERIFICATION',amount:program.amount,print:'1'});window.open('payout-pass.html?'+params.toString(),'_blank')}
function pass(){if(!need(2))return;const control=program.id+'-'+selected.id;p.innerHTML=x()+'<div class="passpreview"><h1>PAYOUT PASS</h1><h2>'+esc(selected.name)+'</h2><p>'+esc(program.name)+'</p><div class="barcode"></div><b>'+esc(control)+'</b></div><p style="text-align:center"><button class="btn" onclick="printPass()">PRINT PAYOUT PASS</button></p>'}
function queue(){if(!need(3))return;if(!selected.queue||selected.queue==='—'){q++;localStorage.setItem('universalQueue',q);updateSelected({queue:'Q-'+String(q).padStart(3,'0')});auditLog('Assigned queue',selected.name+' • '+selected.queue)}p.innerHTML=banner('Live Queue')+'<div class="hero"><strong>'+esc(selected.queue)+'</strong></div>'}

function verificationInbox(){
 let batches=loadBatches().filter(b=>b.status==='FOR VERIFICATION'||b.status==='RESUBMITTED');
 let h=x()+'<h2>Verifier Inbox</h2><p class="muted">Submitted Encoder batches waiting for review.</p>';
 if(!batches.length){p.innerHTML=h+'<div class="notice">No batches waiting for verification.</div>';return}
 p.innerHTML=h+batches.map((b,i)=>'<div class="card"><span class="pill">'+esc(b.status)+'</span><strong>'+esc(b.batch)+'</strong><span class="muted">'+esc(b.programName)+'<br>'+b.rows.length+' beneficiaries • '+esc(b.submittedAt||'')+'</span><div class="rowactions"><button class="btn okbtn" onclick="approveBatch(\''+esc(b.batch)+'\')">APPROVE BATCH</button><button class="btn danger" onclick="returnBatch(\''+esc(b.batch)+'\')">RETURN FOR CORRECTION</button></div></div>').join('')
}
function approveBatch(batchNo){
 let batches=loadBatches(),b=batches.find(x=>x.batch===batchNo);if(!b)return;
 b.status='VERIFIED';b.verifiedAt=new Date().toLocaleString();b.returnReason='';
 saveBatches(batches);
 let all=loadPeople();all.forEach(v=>{if(v.batch===batchNo){v.verifierStatus='VERIFIED';v.verified=true;v.returnReason=''}});savePeople(all);
 auditLog('Verified encoder batch',batchNo);verificationInbox()
}
function returnBatch(batchNo){
 let reason=prompt('Reason for returning this batch to the Encoder:','Please correct the highlighted records.');if(reason===null)return;
 let batches=loadBatches(),b=batches.find(x=>x.batch===batchNo);if(!b)return;
 b.status='RETURNED';b.returnReason=reason||'Returned for correction';b.returnedAt=new Date().toLocaleString();saveBatches(batches);
 let all=loadPeople();all.forEach(v=>{if(v.batch===batchNo){v.verifierStatus='RETURNED';v.returnReason=b.returnReason}});savePeople(all);
 auditLog('Returned encoder batch',batchNo+' • '+b.returnReason);verificationInbox()
}
function verify(){
 openM(4);
 if(who.textContent==='Verifier'&&!selected){verificationInbox();return}
 if(!program||!selected){p.innerHTML=x()+'<h2>Verification</h2><div class="notice">'+(!program?'Select a Payout Program first.':'Select a beneficiary first, or open this module as Verifier to review submitted batches.')+'</div>';return}
 p.innerHTML=banner('Verification')+'<div class="process"><b>'+(selected.returnReason?'RETURNED: '+esc(selected.returnReason):(selected.verified?'VERIFIED':'FOR OFFICIAL VERIFICATION'))+'</b><br><button class="btn gold" id="v">'+(selected.verified?'✓ VERIFIED':'VERIFY BENEFICIARY')+'</button></div>';
 v.onclick=()=>{updateSelected({verified:true,verifierStatus:'VERIFIED',returnReason:''});auditLog('Verified beneficiary',selected.name);verify()}
}
function release(){if(!need(5))return;p.innerHTML=banner('Release Desk')+'<div class="process"><b>'+(selected.verified?'VERIFIED':'PENDING VERIFICATION')+'</b><br><button class="btn gold" id="r">'+(selected.released?'✓ RELEASED':'MARK RELEASED')+'</button></div>';r.onclick=()=>{if(!selected.verified){alert('Verify beneficiary first.');return}updateSelected({released:true,releasedAt:new Date().toLocaleString()});auditLog('Released payout',selected.name);release()}}
function completed(){if(!need(6))return;p.innerHTML=banner('Completed')+'<div class="process"><h3>'+(selected.released?'✓ PAYOUT COMPLETED':'PAYOUT NOT YET COMPLETED')+'</h3>'+(selected.releasedAt?'<p class="muted">'+esc(selected.releasedAt)+'</p>':'')+'</div>'}
function audit(){
 openM(7);let a=JSON.parse(localStorage.getItem('antiPilaAudit')||'[]');
 let h=x()+'<h2>Audit Trail</h2>';
 if(selected&&program)h+='<div class="process"><p>Program: '+esc(program.name)+'</p><p>Beneficiary: '+esc(selected.name)+'</p><p>Queue: '+esc(selected.queue||'—')+'</p><p>Verification: '+(selected.verified?'Completed':'Pending')+'</p><p>Release: '+(selected.released?'Completed':'Pending')+'</p></div>';
 h+='<h3>Recent System Activity</h3>'+(a.length?a.slice(0,40).map(v=>'<div class="card"><strong>'+esc(v.action)+'</strong><span class="muted">'+esc(v.time)+' • '+esc(v.role)+'<br>'+esc(v.detail)+'</span></div>').join(''):'<div class="notice">No activity yet.</div>');
 p.innerHTML=h
}
const actions=[programsM,beneficiaries,pass,queue,verify,release,completed,audit];nodes.forEach((n,i)=>n.onclick=actions[i]);closeM();
</script>
</body>
</html>
