<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA 11982 Anti-Pila Orbit</title><style>:root{--n:#09274a;--n2:#061a33;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);color:white;min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:clamp(22px,4vw,36px)}.top p{margin:5px 0;color:#d9e5f3}.tag{border:1px solid #ffffff33;border-radius:999px;padding:9px 13px;font-size:12px}.layout{display:grid;grid-template-columns:1fr .9fr;gap:24px;align-items:center;margin-top:22px}.orbit{position:relative;aspect-ratio:1;max-width:620px;margin:auto;border-radius:50%;border:1px solid #ffffff2c;background:radial-gradient(circle,#154b7d 0 24%,#09294d 25% 52%,transparent 53%);box-shadow:inset 0 0 70px #0005}.center,.node{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center}.center{inset:34%;background:linear-gradient(145deg,#f8e7b4,#d4a63d);color:var(--n2);padding:12px;box-shadow:0 0 34px #e1b95488}.center b{font-size:clamp(13px,2vw,20px)}.node{width:23%;aspect-ratio:1;background:var(--n);color:white;border:2px solid var(--g);font-weight:800;font-size:11px;padding:8px;cursor:pointer;box-shadow:0 8px 24px #0005}.node:hover,.node.active{background:#fff6df;color:var(--n)}.n1{top:1%;left:38.5%}.n2{top:15%;right:2%}.n3{top:43%;right:-2%}.n4{bottom:7%;right:10%}.n5{bottom:1%;left:38.5%}.n6{bottom:7%;left:10%}.n7{top:43%;left:-2%}.n8{top:15%;left:2%}.panel{background:var(--c);color:var(--ink);border-radius:24px;padding:22px;min-height:500px;box-shadow:0 20px 60px #0006}.panel h2{margin-top:0}.muted{color:#66758a;font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.card{background:white;border:1px solid #eadfc8;border-radius:16px;padding:14px}.card b{font-size:26px;display:block}.btn{border:0;border-radius:12px;background:var(--n);color:white;padding:13px 15px;font-weight:800;cursor:pointer}.btn.gold{background:var(--g);color:#13243a}.search{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:12px;font-size:16px}.list{margin-top:12px}.row{background:white;border:1px solid #e7dfd0;border-radius:14px;padding:13px;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff0c8;color:#76520e;font-size:11px;font-weight:bold}.serving{text-align:center;background:white;border:1px solid #eadfc8;border-radius:18px;padding:20px;margin:14px 0}.serving strong{display:block;font-size:48px;color:var(--n)}.notice{background:#fff4d7;border-left:4px solid var(--g);padding:12px;border-radius:10px;margin-top:14px;font-size:13px}@media(max-width:820px){.layout{grid-template-columns:1fr}.orbit{width:94vw}.panel{min-height:auto}.node{font-size:9px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><header class="top"><div><h1>RA 11982 SENIOR CITIZENS</h1><p>Anti-Pila Digital Payout System</p></div><div class="tag">OSCA • Senior-Friendly Service</div></header><div class="layout"><section class="orbit"><div class="center"><div><b>RA 11982<br>ANTI-PILA<br>PAYOUT</b><div style="font-size:10px;margin-top:5px">Tap a module</div></div></div><button class="node n1" onclick="openM('grantees',this)">NCSC GRANTEES</button><button class="node n2" onclick="openM('pass',this)">DIGITAL PASS</button><button class="node n3" onclick="openM('schedule',this)">PAYOUT SCHEDULE</button><button class="node n4" onclick="openM('queue',this)">LIVE QUEUE</button><button class="node n5" onclick="openM('verify',this)">VERIFICATION</button><button class="node n6" onclick="openM('release',this)">RELEASE DESK</button><button class="node n7" onclick="openM('unclaimed',this)">UNCLAIMED</button><button class="node n8" onclick="openM('audit',this)">AUDIT TRAIL</button></section><section class="panel" id="panel"></section></div></main><script>const p=document.getElementById('panel');let q=Number(localStorage.getItem('queue')||0);const sample=[['CAJAYON, LAUREANO MELGAR','ANIBAN 2','COMPLIANT'],['CASES, ALFREDO VILLANUEVA','DULONG BAYAN','COMPLIANT'],['REA, ROSARIO ATILLO','HABAY 1','REQUIREMENTS FOR REVIEW']];function rows(){return '<div class="list">'+sample.map((x,i)=>'<div class="row"><b>'+x[0]+'</b><div class="muted">'+x[1]+'</div><span class="pill">'+x[2]+'</span></div>').join('')+'</div>'}function cards(){return '<div class="cards"><div class="card"><span class="muted">Unclaimed</span><b>97</b></div><div class="card"><span class="muted">Live Queue</span><b>'+q+'</b></div><div class="card"><span class="muted">Service</span><b>RA 11982</b></div><div class="card"><span class="muted">Mode</span><b>ANTI-PILA</b></div></div>'}function active(el){document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active')}function openM(m,el){active(el);if(m==='grantees')p.innerHTML='<h2>NCSC Grantees</h2><p class="muted">Search and review qualified/validated grantee records before payout.</p><input class="search" placeholder="Search senior name / reference number">'+cards()+rows();if(m==='pass')p.innerHTML='<h2>Digital Payout Pass</h2><p class="muted">Generate a senior-friendly digital transaction pass with QR/reference number, assigned date and time, and payout status.</p><div class="notice"><b>No paper stub required.</b> The pass is a queue and transaction aid and does not replace official eligibility or identity verification.</div><br><button class="btn gold">GENERATE DIGITAL PASS</button>';if(m==='schedule')p.innerHTML='<h2>Payout Schedule</h2><p class="muted">Assign seniors to controlled date and time windows to prevent crowding.</p>'+rows()+'<button class="btn gold">ASSIGN TIME SLOT</button>';if(m==='queue')queue();if(m==='verify')p.innerHTML='<h2>Verification Desk</h2><p class="muted">Confirm identity, NCSC status and documentary requirements before release.</p>'+rows()+'<button class="btn">VERIFY SELECTED SENIOR</button>';if(m==='release')p.innerHTML='<h2>Release Desk</h2><p class="muted">Final payout checkpoint after verification. Production use should record officer, timestamp, amount and acknowledgment.</p>'+rows()+'<button class="btn gold">MARK RELEASED</button>';if(m==='unclaimed')p.innerHTML='<h2>Unclaimed Payouts</h2><p class="muted">Follow up seniors whose authorized payout remains unclaimed.</p>'+cards()+rows();if(m==='audit')p.innerHTML='<h2>Audit Trail</h2><p class="muted">Track verification, scheduling, queue calls, payout release, user and timestamps without deleting history.</p>'+cards()+'<div class="notice">Connect to a secure production database before recording real payout transactions.</div>'}function queue(){p.innerHTML='<h2>Live Anti-Pila Queue</h2><p class="muted">Seniors can wait away from the physical line and proceed when their number is near.</p><div class="serving"><span class="muted">NOW SERVING</span><strong>'+(q?'S-'+String(q).padStart(3,'0'):'—')+'</strong></div><button class="btn gold" onclick="next()">CALL NEXT SENIOR</button> <button class="btn" onclick="resetQ()">RESET</button><div class="notice">Use scheduled time windows plus live queue status to reduce long standing and crowding.</div>'}function next(){q++;localStorage.setItem('queue',q);queue()}function resetQ(){q=0;localStorage.setItem('queue',0);queue()}openM('grantees',document.querySelector('.n1'));</script></body></html>
