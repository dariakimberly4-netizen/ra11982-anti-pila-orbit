<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA 11982 Anti-Pila Orbit</title><style>:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);color:#fff;min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:clamp(22px,4vw,36px)}.top p{margin:5px 0;color:#d9e5f3}.tag{border:1px solid #ffffff33;border-radius:999px;padding:9px 13px;font-size:12px}.layout{display:grid;grid-template-columns:1fr .9fr;gap:24px;align-items:center;margin-top:22px}.orbit{position:relative;aspect-ratio:1;max-width:620px;margin:auto;border-radius:50%;border:1px solid #ffffff2c;background:radial-gradient(circle,#154b7d 0 24%,#09294d 25% 52%,transparent 53%)}.center,.node{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center}.center{inset:34%;background:linear-gradient(145deg,#f8e7b4,#d4a63d);color:#061a33;padding:12px}.node{width:23%;aspect-ratio:1;background:#09274a;color:#fff;border:2px solid var(--g);font-weight:800;font-size:11px;padding:8px;cursor:pointer;touch-action:manipulation}.node.active{background:#fff6df;color:#09274a}.n1{top:1%;left:38.5%}.n2{top:15%;right:2%}.n3{top:43%;right:-2%}.n4{bottom:7%;right:10%}.n5{bottom:1%;left:38.5%}.n6{bottom:7%;left:10%}.n7{top:43%;left:-2%}.n8{top:15%;left:2%}.panel{background:var(--c);color:var(--ink);border-radius:24px;padding:22px;min-height:500px;box-shadow:0 20px 60px #0006}.muted{color:#66758a;font-size:13px}.search{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:12px;font-size:16px}.beneficiary{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e7dfd0;border-radius:16px;padding:16px;margin:10px 0;color:var(--ink);cursor:pointer;touch-action:manipulation;font:inherit;box-shadow:0 3px 10px #0000000b}.beneficiary:active,.beneficiary:focus{border:2px solid var(--g);outline:none;background:#fff9ea}.beneficiary strong{display:block;font-size:16px}.openpass{display:block;margin-top:10px;font-weight:800;color:#09274a}.pill{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:#fff0c8;color:#76520e;font-size:11px;font-weight:bold}.btn{border:0;border-radius:12px;background:#09274a;color:#fff;padding:13px 15px;font-weight:800;cursor:pointer;margin:4px;touch-action:manipulation}.btn.gold{background:var(--g);color:#13243a}.pass{background:#fff;border:2px solid var(--g);border-radius:20px;padding:18px}.passhead{text-align:center;border-bottom:1px solid #e8dcc2;padding-bottom:12px;margin-bottom:14px}.passhead h2{color:#09274a;margin:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#f8f5ed;border-radius:10px;padding:10px}.field small{display:block;color:#718096}.field b{display:block;margin-top:3px}.qr{width:105px;height:105px;margin:14px auto;background:repeating-conic-gradient(#10233d 0 25%,#fff 0 50%) 0/18px 18px;border:8px solid #fff;outline:1px solid #ccc}.serving{text-align:center;background:#fff;border:1px solid #eadfc8;border-radius:18px;padding:20px;margin:14px 0}.serving strong{display:block;font-size:48px;color:#09274a}.notice{background:#fff4d7;border-left:4px solid var(--g);padding:12px;border-radius:10px;margin-top:14px;font-size:13px}@media(max-width:820px){.layout{grid-template-columns:1fr}.orbit{width:92vw}.panel{min-height:auto}.node{font-size:9px}.top{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.top,.orbit,.no-print{display:none!important}.layout{display:block}.panel{box-shadow:none;padding:0}.pass{max-width:700px;margin:auto}}</style></head><body><main class="app"><header class="top"><div><h1>RA 11982 SENIOR CITIZENS</h1><p>Anti-Pila Digital Payout System</p></div><div class="tag">OSCA • Senior-Friendly Service</div></header><div class="layout"><section class="orbit"><div class="center"><b>RA 11982<br>ANTI-PILA<br>PAYOUT</b></div><button class="node n1" data-action="grantees">NCSC GRANTEES</button><button class="node n2" data-action="pass">DIGITAL PASS</button><button class="node n3" data-action="schedule">PAYOUT SCHEDULE</button><button class="node n4" data-action="queue">LIVE QUEUE</button><button class="node n5" data-action="verify">VERIFICATION</button><button class="node n6" data-action="release">RELEASE DESK</button><button class="node n7" data-action="grantees">UNCLAIMED</button><button class="node n8" data-action="audit">AUDIT TRAIL</button></section><section class="panel" id="panel"></section></div></main><script>const p=document.getElementById('panel');let q=Number(localStorage.getItem('queue')||0);const people=[{name:'CAJAYON, LAUREANO MELGAR',barangay:'ANIBAN 2',id:'OSCA-ANB-001234',ref:'RA11982-AY5T4E2C58',dob:'1944-07-04',age:'81',amount:'₱10,000',milestone:'Age 80',status:'QUALIFIED GRANTEE',req:'COMPLIANT',date:'TO BE SCHEDULED',time:'—',queue:'—'},{name:'CASES, ALFREDO VILLANUEVA',barangay:'DULONG BAYAN',id:'OSCA-DB-001235',ref:'RA11982-CAS-001235',dob:'1945-02-18',age:'81',amount:'₱10,000',milestone:'Age 80',status:'QUALIFIED GRANTEE',req:'COMPLIANT',date:'TO BE SCHEDULED',time:'—',queue:'—'},{name:'REA, ROSARIO ATILLO',barangay:'HABAY 1',id:'OSCA-HB-001236',ref:'RA11982-REA-001236',dob:'1941-11-09',age:'84',amount:'₱10,000',milestone:'Record for review',status:'FOR REVIEW',req:'REQUIREMENTS FOR REVIEW',date:'NOT YET SCHEDULED',time:'—',queue:'—'}];let selected=people[0];function active(el){document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));if(el)el.classList.add('active')}function grantees(el){active(el);p.innerHTML='<h2>Select Beneficiary</h2><p class="muted">Tap anywhere on a beneficiary card to view the Digital Payout Pass.</p><input class="search" id="s" placeholder="Search name, OSCA ID or barangay"><div id="results"></div>';document.getElementById('s').addEventListener('input',filterPeople);render(people)}function render(arr){const r=document.getElementById('results');r.innerHTML='';arr.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='beneficiary';b.dataset.ref=x.ref;b.innerHTML='<strong>'+x.name+'</strong><span class="muted">'+x.barangay+' • '+x.id+'</span><br><span class="pill">'+x.status+'</span><span class="openpass">VIEW DIGITAL PASS →</span>';b.addEventListener('click',()=>selectPerson(x.ref));r.appendChild(b)});if(!arr.length)r.innerHTML='<div class="notice">No beneficiary found.</div>'}function filterPeople(e){const s=e.target.value.toLowerCase();render(people.filter(x=>(x.name+' '+x.id+' '+x.barangay+' '+x.ref).toLowerCase().includes(s)))}function selectPerson(ref){const person=people.find(x=>x.ref===ref);if(!person)return;selected=person;showPass(person)}function showPass(x,el){active(el);x=x||selected;p.innerHTML='<div class="pass"><div class="passhead"><small>RA 11982 SENIOR CITIZENS</small><h2>DIGITAL PAYOUT PASS</h2><b>Reference: '+x.ref+'</b></div><div class="grid"><div class="field"><small>BENEFICIARY</small><b>'+x.name+'</b></div><div class="field"><small>OSCA ID</small><b>'+x.id+'</b></div><div class="field"><small>BARANGAY</small><b>'+x.barangay+'</b></div><div class="field"><small>DATE OF BIRTH / AGE</small><b>'+x.dob+' • '+x.age+'</b></div><div class="field"><small>PAYOUT</small><b>'+x.amount+' • '+x.milestone+'</b></div><div class="field"><small>STATUS</small><b>'+x.status+'</b></div><div class="field"><small>REQUIREMENTS</small><b>'+x.req+'</b></div><div class="field"><small>SCHEDULE</small><b>'+x.date+' '+x.time+'</b></div><div class="field"><small>QUEUE NUMBER</small><b>'+x.queue+'</b></div><div class="field"><small>PAYOUT STATUS</small><b>NOT YET RELEASED</b></div></div><div class="qr"></div><div style="text-align:center;font-size:11px">'+x.ref+'</div></div><div class="no-print" style="margin-top:14px"><button class="btn" id="back">← BENEFICIARIES</button><button class="btn gold" id="print">PRINT PASS</button><button class="btn" id="assign">ASSIGN QUEUE</button></div>';document.getElementById('back').onclick=()=>grantees();document.getElementById('print').onclick=()=>window.print();document.getElementById('assign').onclick=scheduleSelected}function scheduleSelected(){q++;localStorage.setItem('queue',q);selected.queue='S-'+String(q).padStart(3,'0');selected.date='ASSIGNED';showPass(selected)}function queue(el){active(el);p.innerHTML='<h2>Live Anti-Pila Queue</h2><div class="serving"><span class="muted">NOW SERVING</span><strong>'+(q?'S-'+String(q).padStart(3,'0'):'—')+'</strong></div><button class="btn gold" id="next">CALL NEXT SENIOR</button>';document.getElementById('next').onclick=()=>{q++;localStorage.setItem('queue',q);queue()}}function simple(title,text,el){active(el);p.innerHTML='<h2>'+title+'</h2><p class="muted">'+text+'</p><div class="notice">Select a beneficiary from NCSC Grantees to work with an individual record.</div>'}document.querySelectorAll('.node').forEach(btn=>btn.addEventListener('click',()=>{const a=btn.dataset.action;if(a==='grantees')grantees(btn);else if(a==='pass')showPass(selected,btn);else if(a==='queue')queue(btn);else simple(btn.textContent,'Select a beneficiary first to process this module.',btn)}));grantees(document.querySelector('.n1'));</script></body></html>
