<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anti-Pila Payout System</title><style>:root{--n:#09274a;--g:#d8ad4b;--c:#fffaf0;--ink:#10233d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06162c,#0d3a68);color:#fff;min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:clamp(24px,4vw,38px)}.top p{margin:5px 0;color:#d9e5f3}.tag{border:1px solid #ffffff33;border-radius:999px;padding:9px 13px;font-size:12px}.layout{display:grid;grid-template-columns:1fr .9fr;gap:24px;align-items:center;margin-top:22px}.layout.orbit-only{display:block}.orbit{position:relative;aspect-ratio:1;max-width:620px;margin:auto;border-radius:50%;border:1px solid #ffffff2c;background:radial-gradient(circle,#154b7d 0 24%,#09294d 25% 52%,transparent 53%)}.center,.node{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center}.center{inset:34%;background:linear-gradient(145deg,#f8e7b4,#d4a63d);color:#061a33;padding:12px}.node{width:22%;aspect-ratio:1;background:#09274a;color:#fff;border:2px solid var(--g);font-weight:800;font-size:10px;padding:8px;cursor:pointer}.node.active{background:#fff6df;color:#09274a}.n1{top:1%;left:39%}.n2{top:14%;right:4%}.n3{top:43%;right:-2%}.n4{bottom:7%;right:9%}.n5{bottom:1%;left:39%}.n6{bottom:7%;left:9%}.n7{top:43%;left:-2%}.n8{top:14%;left:4%}.panel{background:var(--c);color:var(--ink);border-radius:24px;padding:22px;min-height:500px}.panel.hidden{display:none}.muted{color:#66758a;font-size:13px}.card,.process{background:#fff;border:1px solid #e6dcc7;border-radius:16px;padding:16px;margin:10px 0}.card{width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.card.selected{border:3px solid var(--g)}.card strong{display:block}.pill{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:#fff0c8;color:#76520e;font-size:11px;font-weight:bold}.search{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:12px}.btn{border:0;border-radius:12px;background:#09274a;color:#fff;padding:14px 16px;font-weight:800;cursor:pointer}.btn.gold{background:var(--g);color:#13243a}.hero{text-align:center;background:#f8f5ed;border-radius:16px;padding:18px;margin:12px 0}.hero strong{font-size:24px;color:#09274a;display:block}.notice{background:#fff4d7;border-left:4px solid var(--g);padding:12px;border-radius:10px}.close{float:right;border:0;background:#eee;border-radius:999px;width:38px;height:38px;font-size:20px}.passpreview{background:#fff;color:var(--n);padding:28px;border-radius:16px;text-align:center}.barcode{height:72px;margin:22px auto 6px;max-width:520px;background:repeating-linear-gradient(90deg,#000 0 3px,#fff 3px 6px,#000 6px 8px,#fff 8px 13px,#000 13px 18px,#fff 18px 21px)}@media(max-width:820px){.layout{display:block}.orbit{width:92vw}.panel{margin-top:20px}.node{font-size:8.5px}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="app"><header class="top"><div><h1>ANTI-PILA PAYOUT SYSTEM</h1><p>Universal Digital Payout & Distribution Management</p></div><div class="tag">Fast • Organized • Traceable</div></header><div class="layout orbit-only" id="layout"><section class="orbit"><div class="center"><b>ANTI-PILA<br>PAYOUT<br>COMMAND CENTER</b></div><button class="node n1">PAYOUT PROGRAMS</button><button class="node n2">BENEFICIARIES</button><button class="node n3">DIGITAL PASS</button><button class="node n4">LIVE QUEUE</button><button class="node n5">VERIFICATION</button><button class="node n6">RELEASE DESK</button><button class="node n7">COMPLETED</button><button class="node n8">AUDIT TRAIL</button></section><section class="panel hidden" id="panel"></section></div></main><script>const p=document.getElementById('panel'),layout=document.getElementById('layout'),nodes=[...document.querySelectorAll('.node')];let program=null,selected=null,q=Number(localStorage.getItem('universalQueue')||0);const programs=[{id:'P-001',name:'Senior Citizen Cash Benefit',office:'Social Services / OSCA',amount:'Program-defined',status:'ACTIVE'},{id:'P-002',name:'Financial Assistance Payout',office:'Social Services',amount:'Program-defined',status:'ACTIVE'},{id:'P-003',name:'Employee Benefit / Allowance',office:'Human Resources',amount:'Program-defined',status:'ACTIVE'},{id:'P-004',name:'Special Assistance Program',office:'Program Office',amount:'Program-defined',status:'ACTIVE'}];const demo=[{name:'DEMO BENEFICIARY 001',id:'DEMO-001',area:'Sample Area A',status:'ELIGIBLE',req:'FOR OFFICIAL VERIFICATION'},{name:'DEMO BENEFICIARY 002',id:'DEMO-002',area:'Sample Area B',status:'ELIGIBLE',req:'FOR OFFICIAL VERIFICATION'},{name:'DEMO BENEFICIARY 003',id:'DEMO-003',area:'Sample Area C',status:'FOR REVIEW',req:'FOR OFFICIAL VERIFICATION'}];function openM(i){layout.classList.remove('orbit-only');p.classList.remove('hidden');nodes.forEach((n,j)=>n.classList.toggle('active',j===i));if(innerWidth<821)setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'start'}),50)}function closeM(){p.classList.add('hidden');layout.classList.add('orbit-only');nodes.forEach(n=>n.classList.remove('active'))}function x(){return '<button class="close" onclick="closeM()">×</button>'}function programsM(){openM(0);p.innerHTML=x()+'<h2>Payout Programs</h2><div id="programs"></div>';const d=document.getElementById('programs');programs.forEach(a=>{const b=document.createElement('button');b.className='card'+(program&&program.id===a.id?' selected':'');b.innerHTML='<strong>'+a.name+'</strong><span class="muted">'+a.office+' • '+a.id+'</span>';b.onclick=()=>{program=a;selected=null;programsM()};d.appendChild(b)})}function beneficiaries(){openM(1);if(!program){p.innerHTML=x()+'<h2>Beneficiaries</h2><div class="notice">Select a Payout Program first.</div>';return}p.innerHTML=x()+'<h2>Beneficiaries</h2><div class="hero"><strong>'+program.name+'</strong></div><input id="s" class="search" placeholder="Search beneficiary"><div id="people"></div>';s.oninput=()=>renderPeople(demo.filter(a=>(a.name+a.id+a.area).toLowerCase().includes(s.value.toLowerCase())));renderPeople(demo)}function renderPeople(arr){const d=document.getElementById('people');d.innerHTML='';arr.forEach(a=>{const b=document.createElement('button');b.className='card'+(selected&&selected.id===a.id?' selected':'');b.innerHTML='<strong>'+a.name+'</strong><span class="muted">'+a.id+' • '+a.area+'</span>';b.onclick=()=>{selected=a;if(!selected.queue)selected.queue='—';renderPeople(demo)};d.appendChild(b)})}function need(i){openM(i);if(!program){p.innerHTML=x()+'<h2>'+nodes[i].textContent+'</h2><div class="notice">Select a Payout Program first.</div>';return false}if(!selected){p.innerHTML=x()+'<h2>'+nodes[i].textContent+'</h2><div class="notice">Select a beneficiary first.</div>';return false}return true}function banner(t){return x()+'<div class="hero"><span class="muted">'+program.name+'</span><strong>'+selected.name+'</strong></div><h2>'+t+'</h2>'}function printPass(){const control=program.id+'-'+selected.id;const w=window.open('','_blank');if(!w){alert('Allow pop-ups to print the payout pass.');return}w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payout Pass</title><style>@page{size:A4 portrait;margin:0}*{box-sizing:border-box}html,body{margin:0!important;padding:0!important;width:210mm;height:296mm;overflow:hidden;background:#fff;font-family:Arial,sans-serif;color:#09274a}.sheet{position:relative;width:210mm;height:296mm;padding:18mm 18mm 14mm;overflow:hidden}.brand{text-align:center;color:#d8ad4b;font-size:20pt;font-weight:800;letter-spacing:5px}.sub{text-align:center;font-size:8pt;letter-spacing:5px;margin-top:1mm}.title{text-align:center;font-size:35pt;font-weight:900;margin:9mm 0 12mm}.label{font-size:7pt;letter-spacing:1px;color:#667085;margin-bottom:1mm}.value{font-size:14pt;font-weight:800;line-height:1.15}.name .value{font-size:20pt}.field{margin-bottom:7mm}.row{display:grid;grid-template-columns:1fr 1fr;gap:10mm}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm}.barcode{height:18mm;margin:10mm auto 2mm;max-width:155mm;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 6px,#fff 6px 9px,#000 9px 13px,#fff 13px 16px)}.code{text-align:center;font-size:10pt;letter-spacing:2px}.note{text-align:center;margin-top:9mm;font-size:9pt;font-weight:800;letter-spacing:1px}.note small{display:block;font-weight:400;font-size:7pt;margin-top:2mm}@media print{html,body,.sheet{width:210mm!important;height:296mm!important;overflow:hidden!important}.sheet{break-inside:avoid!important;page-break-inside:avoid!important}}</style></head><body><main class="sheet"><div class="brand">ANTI-PILA</div><div class="sub">PAYOUT SYSTEM</div><div class="title">PAYOUT PASS</div><div class="field name"><div class="label">NAME</div><div class="value">${selected.name}</div></div><div class="field"><div class="label">PROGRAM</div><div class="value">${program.name}</div></div><div class="field"><div class="label">CONTROL NO.</div><div class="value">${control}</div></div><div class="row"><div class="field"><div class="label">PAYOUT DATE</div><div class="value">OFFICIAL PAYOUT DATE</div></div><div class="field"><div class="label">VENUE</div><div class="value">OFFICIAL PAYOUT VENUE</div></div></div><div class="three"><div class="field"><div class="label">QUEUE NO.</div><div class="value">${selected.queue}</div></div><div class="field"><div class="label">STATUS</div><div class="value">${selected.verified?'VERIFIED':'FOR VERIFICATION'}</div></div><div class="field"><div class="label">AMOUNT</div><div class="value">${program.amount}</div></div></div><div class="barcode"></div><div class="code">${control}</div><div class="note">PLEASE BRING THIS PASS AND A VALID ID.<small>Present this pass at the authorized payout desk.</small></div></main><script>window.onload=function(){setTimeout(function(){window.print()},250)}<\/script></body></html>`);w.document.close()}function pass(){if(!need(2))return;const control=program.id+'-'+selected.id;p.innerHTML=x()+'<div class="passpreview"><h1>PAYOUT PASS</h1><h2>'+selected.name+'</h2><p>'+program.name+'</p><div class="barcode"></div><b>'+control+'</b></div><p style="text-align:center;margin-top:18px"><button class="btn" onclick="printPass()">PRINT PAYOUT PASS</button></p>'}function queue(){if(!need(3))return;if(selected.queue==='—'){q++;localStorage.setItem('universalQueue',q);selected.queue='Q-'+String(q).padStart(3,'0')}p.innerHTML=banner('Live Queue')+'<div class="hero"><strong>'+selected.queue+'</strong></div>'}function verify(){if(!need(4))return;p.innerHTML=banner('Verification')+'<div class="process"><b>'+selected.req+'</b><br><button class="btn gold" id="v">'+(selected.verified?'✓ VERIFIED':'VERIFY BENEFICIARY')+'</button></div>';v.onclick=()=>{selected.verified=true;verify()}}function release(){if(!need(5))return;p.innerHTML=banner('Release Desk')+'<div class="process"><b>'+(selected.verified?'VERIFIED':'PENDING')+'</b><br><button class="btn gold" id="r">'+(selected.released?'✓ RELEASED':'MARK RELEASED')+'</button></div>';r.onclick=()=>{if(!selected.verified){alert('Verify beneficiary first.');return}selected.released=true;release()}}function completed(){if(!need(6))return;p.innerHTML=banner('Completed')+'<div class="process"><h3>'+(selected.released?'✓ PAYOUT COMPLETED':'PAYOUT NOT YET COMPLETED')+'</h3></div>'}function audit(){if(!need(7))return;p.innerHTML=banner('Audit Trail')+'<div class="process"><p>Program: '+program.name+'</p><p>Beneficiary: '+selected.name+'</p><p>Queue: '+selected.queue+'</p><p>Verification: '+(selected.verified?'Completed':'Pending')+'</p><p>Release: '+(selected.released?'Completed':'Pending')+'</p></div>'}const actions=[programsM,beneficiaries,pass,queue,verify,release,completed,audit];nodes.forEach((n,i)=>n.onclick=actions[i]);closeM();</script></body></html>
